<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Food Menu Management</title>
</head>
<body style="font-family: Arial, sans-serif; padding: 20px;">

    <div style="float: right;">
        <button onclick="logout()">Logout 🚪</button>
    </div>

    <h1>Food Menu Management </h1>
    
    <hr>

  <h2 th:text="${isEdit} ? 'Edit Menu Item' : 'Add New Menu Item'">Add New Menu Item</h2>
 <!-- <form id="addForm" th:action="@{/menu/add}" method="POST" enctype="multipart/form-data" onsubmit="appendTokenToForm(this)"> -->
 <form id="menuForm" 
      th:action="${isEdit} ? @{/menu/update/{id}(id=${item.id})} : @{/menu/add}" 
      method="POST" 
      enctype="multipart/form-data" 
      onsubmit="appendTokenToForm(this)">   
        <label>Item Name:</label><br>
      <input type="text" name="name" th:value="${item?.name}" required><br>

        <label>Description:</label><br>
       <textarea name="description" rows="2" required th:text="${item?.description}"></textarea><br>

        <label>Price ($):</label><br>
       <input type="number" name="price" step="0.01" th:value="${item?.price}" required><br>

        <label>Category:</label><br>
        <select name="categoryName" required>
            <option value="Appetizer">Appetizer</option>
            <option value="Main">Main</option>
            <option value="Dessert">Dessert</option>
        </select><br><br>
        
		<label>Dish Image File:</label>
<span th:if="${isEdit}" style="font-size: 0.85em; color: gray;">(Leave blank to keep current image)</span><br>

<input type="file" name="imageFile" accept="image/*" th:required="${!isEdit}"><br><br>
        <button type="submit">Save Item</button>
    </form>

    <hr>

    <h2>Current Menu</h2>
    <div>
        <div th:each="item : ${menuItems}" style="margin-bottom: 20px; padding: 10px; background: #fafafa; border: 1px solid #eee;">
           <div th:if="${item.imageName != null}">
       		 <img th:src="@{'/' + ${item.imageName}}" alt="dish image" style="max-width: 150px; height: auto; display: block; margin-bottom: 10px; border: 1px solid #ddd;">
    	   </div>
            <b th:text="${item.name}">Item Name</b> 
            (<span th:text="${item.category.name}">Category</span>) - 
            $<span th:text="${item.price}">0.00</span>
            <p th:text="${item.description}">Description</p>
            <a th:href="@{/menu/edit/{id}(id=${item.id})}" onclick="appendTokenToEditLink(this, event)" style="color: #e67e22; margin-right: 15px; text-decoration: none; font-weight: bold;">[ Edit Item ]</a>
            <a th:href="@{/menu/delete/{id}(id=${item.id})}" onclick="appendTokenToLink(this, event)">[ Delete Item ]</a>
        </div>
    </div>

    <script>
        // Security check: If someone tries to access /menu directly without a token in storage, kick them out
        const token = localStorage.getItem("jwtToken");
        if (!token && !window.location.search.includes("token")) {
            window.location.href = "/login";
        }

        // Appends token to form action URL before submission
        function appendTokenToForm(form) {
            form.action = form.action + "?token=" + localStorage.getItem("jwtToken");
        }
        
        
        function appendTokenToEditLink(link, event) {
            event.preventDefault();
            const securedUrl = link.href + "?token=" + localStorage.getItem("jwtToken");
            window.location.href = securedUrl;
        }
        
        // Appends token to the delete link URL before navigating
        function appendTokenToLink(link, event) {
            event.preventDefault();
            const securedUrl = link.href + "?token=" + localStorage.getItem("jwtToken");
            window.location.href = securedUrl;
        }

        // Logs out by destroying the stored session string token
        function logout() {
            localStorage.removeItem("jwtToken");
            window.location.href = "/login";
        }
    </script>
</body>
</html>
