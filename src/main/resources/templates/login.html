<!DOCTYPE html>
<html>
<body style="font-family: Arial; padding: 30px; text-align: center;">

    <h2 id="title">Login</h2>
    <div style="background: #f0f0f0; padding: 20px; display: inline-block; text-align: left;">
        <label>Username:</label><br>
        <input type="text" id="username" style="width: 200px;"><br><br>
        
        <label>Password:</label><br>
        <input type="password" id="password" style="width: 200px;"><br><br>
        
        <button type="button" id="btn" onclick="submitAuth()">Login & Authorize</button>
        <br><br>
        
        <a href="javascript:void(0)" id="toggleLink" onclick="toggleMode()">Switch to Register</a>
    </div>

    <script>
        let isRegister = false;

        function toggleMode() {
            isRegister = !isRegister;
            document.getElementById('title').innerText = isRegister ? "Register" : "Login";
            document.getElementById('btn').innerText = isRegister ? "Register Account" : "Login & Authorize";
            document.getElementById('toggleLink').innerText = isRegister ? "Switch to Login" : "Switch to Register";
        }

        async function submitAuth() {
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            
            // Dynamic path picking based on toggle state
            const path = isRegister ? '/api/auth/register' : '/api/auth/login';

            try {
                const res = await fetch(path, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: u, password: p })
                });

                if (!isRegister && res.ok) {
                    const data = await res.json();
                    localStorage.setItem("jwtToken", data.token);
                    window.location.replace("/menu?token=" + data.token);
                } else {
                    alert(await res.text() || "Success!");
                    if (isRegister && res.ok) toggleMode(); // Auto flip back to login view on signup success
                }
            } catch (err) {
                alert("Network error.");
            }
        }
    </script>
</body>
</html>
